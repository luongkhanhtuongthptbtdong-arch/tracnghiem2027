<!DOCTYPE html>
<html lang="vi">
<head>
<script>window.LKT_SKIN='ios'</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--pri:#1d3fa8;--pri2:#3b6cf6;--acc:#f59e0b;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--bg:#eef2fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#13287a,#1d3fa8 45%,#3b6cf6);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px #0003}
header .logo{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:-.5px}
header h1{font-size:17px;margin:0;line-height:1.1}
header small{opacity:.85;font-size:12px}
header .act{margin-left:auto;font-size:12px;background:#ffffff22;padding:5px 10px;border-radius:20px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px 12px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0001}
nav.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button.on svg{stroke-width:2.4}
@media(min-width:900px){nav.tabs{top:64px;bottom:auto;left:0;right:auto;width:92px;height:calc(100vh - 64px);flex-direction:column;justify-content:flex-start;gap:6px;border:0;border-right:1px solid var(--line);padding-top:14px}main{margin-left:100px;padding-bottom:30px}nav.tabs button{flex:none;padding:10px 0}}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a14}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:transparent}
.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;background:#e7edfb;color:var(--pri);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 3px 10px #1d3fa855}
.btn.g{background:var(--ok);color:#fff}.btn.r{background:#fee2e2;color:var(--bad)}.btn.o{background:#fff7e6;color:#b45309}
.btn.big{padding:16px;font-size:16px;width:100%;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:active{transform:scale(.97)}
.muted{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#e7edfb;color:var(--pri)}
.pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}.pill.w{background:#fef3c7;color:#92400e}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tres td:nth-child(3){min-width:120px}th{background:#f1f5fd;font-size:12px;color:#334155;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover{background:#f8faff}
.tw{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi div{background:linear-gradient(160deg,#f6f8ff,#eaf0ff);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--pri)}.kpi span{font-size:12px;color:var(--mut)}
.seg{display:flex;background:#e7edfb;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;color:var(--pri);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 4px #0002}
#modal{position:fixed;inset:0;z-index:50;display:none;background:#0f172acc;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 8px 20px}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:16px;max-width:980px;margin:0 auto;padding:14px;position:relative}
#modal .x{position:absolute;right:10px;top:8px;border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f172aee;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 4px 14px #0004;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.camwrap{position:relative;background:#000;border-radius:12px;overflow:hidden}
.camwrap video{width:100%;display:block;max-height:70vh;object-fit:contain}
.camwrap canvas{position:absolute;left:0;top:0;pointer-events:none}
.camst{position:absolute;left:8px;right:8px;bottom:8px;background:#000a;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px;text-align:center}
.camres{position:absolute;left:8px;right:8px;top:8px;background:#16a34aee;color:#fff;border-radius:10px;padding:8px 10px;font-size:15px;text-align:center;font-weight:700;display:none}
.revwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;background:#f8fafc;touch-action:pan-x pan-y}
.revwrap canvas{display:block;transform-origin:0 0}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri2)}
.dist{display:flex;gap:3px;align-items:flex-end;height:44px}
.dist span{flex:1;background:#cbd5e1;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.dist span.k{background:var(--ok)}
.keyhint{font-size:12px;color:var(--mut);margin:2px 0 8px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}
.score{min-width:52px;text-align:center;font-weight:800;font-size:18px;color:var(--pri);background:#eef2ff;border-radius:10px;padding:6px 4px}
.hero{background:linear-gradient(135deg,#1d3fa8,#3b6cf6 60%,#60a5fa);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:18px}.hero p{margin:0;opacity:.9;font-size:13px}
.drop{border:2px dashed #93c5fd;border-radius:14px;padding:18px;text-align:center;color:var(--mut);background:#f8fbff}
.prog{height:6px;background:#dbeafe;border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;font-size:12.5px}
.ansgrid div{border:1px solid var(--line);border-radius:7px;padding:3px 5px;display:flex;justify-content:space-between}
.ansgrid .ok{background:#ecfdf5;border-color:#a7f3d0}.ansgrid .bad{background:#fef2f2;border-color:#fecaca}
.impbar{background:#f1f5fd;border-radius:12px;padding:10px}
.impbox{background:#f8faff;border:1px dashed #93c5fd;border-radius:12px;padding:10px;margin:8px 0}
.kcard{background:#fbfcff;border:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:4px 10px}
.kq{display:flex;align-items:center;gap:4px;padding:2px 0}.kq b{width:24px;text-align:right;font-size:13px;color:#334155}
.kb{width:30px;height:30px;border-radius:50%;border:1.6px solid #f0517f;background:#fff;color:#be185d;font-weight:700;font-size:13px;cursor:pointer;padding:0}
.kb.on{background:#1d3fa8;border-color:#1d3fa8;color:#fff}.kb.ds{width:30px;height:30px;font-size:12px}
.kgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}.kds4{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;flex:1}.kds{display:flex;align-items:center;gap:3px}
.kq2{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}.kq2 b{width:52px;font-size:13px}.ksub{width:18px;font-size:12.5px;color:#64748b}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.kq3{display:flex;flex-direction:column;font-size:13px;gap:2px}.kq3 input{text-align:center;font-weight:700;font-size:16px;letter-spacing:2px}
footer{text-align:center;font-size:12px;color:var(--mut);padding:10px}
.hide{display:none!important}
/* ===================== GIAO DIỆN: 3 PHONG CÁCH + MÀU + SÁNG/TỐI ===================== */
body{--soft:color-mix(in srgb,var(--pri) 10%,var(--card));--soft2:color-mix(in srgb,var(--pri) 20%,var(--card))}
body.dark{--soft:color-mix(in srgb,var(--pri) 22%,var(--card));--soft2:color-mix(in srgb,var(--pri) 32%,var(--card))}
:root{--in:#fff;--inb:#cbd5e1;--nav:#fff;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
html,body{font-family:var(--font)}
body.dark{--bg:#0d1015;--card:#161a21;--tx:#e8ebf1;--mut:#97a1b2;--line:#262c37;--in:#10141a;--inb:#303847;--nav:#12161c}
.btn{background:var(--soft)}.pill{background:var(--soft)}.seg{background:var(--soft)}.seg button.on{background:var(--card)}
th{background:var(--soft);color:var(--tx)}tr.click:hover{background:var(--soft)}
.kpi div{background:linear-gradient(160deg,var(--soft),var(--soft2))}
input,select,textarea{background:var(--in);border-color:var(--inb);color:var(--tx)}
#modal .box{background:var(--card);color:var(--tx)}#modal .x{background:var(--soft);color:var(--tx)}
.impbar{background:var(--soft)}.impbox{background:color-mix(in srgb,var(--pri) 5%,var(--card));border-color:color-mix(in srgb,var(--pri) 40%,transparent)}
.kcard{background:var(--card)}.kq2,.kb{background:var(--card)}.kb.on{background:var(--pri);border-color:var(--pri)}.revwrap{background:var(--soft)}.drop{background:var(--soft);border-color:color-mix(in srgb,var(--pri) 45%,transparent)}
.score{background:var(--soft);color:var(--pri)}.bar{background:var(--line)}.bar i{background:var(--pri2)}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 3px 12px color-mix(in srgb,var(--pri) 35%,transparent)}
body.dark .btn.r{background:#3a1717}body.dark .btn.o{background:#3a2a10;color:#fbbf24}body.dark .pill.ok{background:#12351f;color:#86efac}body.dark .pill.w{background:#3a2c0b;color:#fcd34d}body.dark .pill.bad{background:#3a1717;color:#fca5a5}
body.dark .ansgrid .ok{background:#0f2a1b;border-color:#14532d}body.dark .ansgrid .bad{background:#2c1212;border-color:#7f1d1d}body.dark .card [style*="background:#f8faff"]{background:var(--soft)!important}
body.fs-s #view,body.fs-s #mbox{zoom:.92}body.fs-l #view,body.fs-l #mbox{zoom:1.1}body.fs-xl #view,body.fs-xl #mbox{zoom:1.22}
header{gap:10px}header .hbtn{border:0;background:#ffffff26;color:inherit;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
header .act{margin-left:auto}
nav.tabs button{gap:3px}nav.tabs .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:16px;transition:.2s}
nav.tabs .lb{white-space:nowrap}
@media(max-width:899px){nav.tabs .wide{display:none}}
@media(min-width:900px){#menuBtn{display:none}}
.fab{display:none}
@media(max-width:560px){header small{display:none}header h1{white-space:nowrap;font-size:16.5px;overflow:hidden;text-overflow:ellipsis}header .act{display:none}header>div:nth-child(2){flex:1}}
/* ---------- WINDOWS · Fluent ---------- */
body.skin-win{--font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--r:8px;--bg:#f3f3f3;background:radial-gradient(1100px 520px at -10% -10%,color-mix(in srgb,var(--pri) 16%,transparent),transparent 70%),radial-gradient(900px 520px at 110% -10%,color-mix(in srgb,var(--pri2) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
body.skin-win.dark{--bg:#1c1c1c;--card:#272727;--nav:#202020}
.skin-win header{background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);color:var(--tx);box-shadow:none;border-bottom:1px solid var(--line);min-height:56px}
.skin-win header .logo{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:6px}.skin-win header .hbtn{background:var(--soft)}.skin-win header .act{background:var(--soft);color:var(--pri)}
.skin-win .card{border:1px solid var(--line);box-shadow:0 2px 4px #0000000a;background:color-mix(in srgb,var(--card) 92%,transparent)}
.skin-win .btn{border-radius:6px}.skin-win .btn.p{box-shadow:none}.skin-win .seg,.skin-win .seg button{border-radius:6px}
.skin-win nav.tabs{background:color-mix(in srgb,var(--nav) 80%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
@media(min-width:700px){.skin-win nav.tabs{top:57px;bottom:0;left:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;gap:2px;border:0;border-right:1px solid var(--line);padding:10px 8px;box-shadow:none}
 .skin-win nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 10px;font-size:14px;border-radius:6px;position:relative;color:var(--tx)}
 .skin-win nav.tabs .ic{width:22px;height:22px}.skin-win nav.tabs button:hover{background:var(--soft)}
 .skin-win nav.tabs button.on{background:var(--soft);color:var(--tx)}.skin-win nav.tabs button.on::before{content:"";position:absolute;left:0;top:50%;width:3px;height:18px;margin-top:-9px;border-radius:3px;background:var(--pri)}
 .skin-win nav.tabs button.on .ic{color:var(--pri)}.skin-win nav.tabs .wide{display:flex}.skin-win #menuBtn{display:none}
 .skin-win main{margin-left:228px;padding-bottom:30px;max-width:1180px}}
/* ---------- iOS · Cupertino ---------- */
body.skin-ios{--font:-apple-system,"SF Pro Text","SF Pro Display",system-ui,sans-serif;--r:14px;--bg:#f2f2f7}
body.skin-ios.dark{--bg:#000;--card:#1c1c1e;--nav:#121214;--line:#2c2c2e}
.skin-ios header{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);color:var(--tx);box-shadow:none;border-bottom:.5px solid var(--line)}
.skin-ios header .logo{border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}.skin-ios header .hbtn{background:var(--soft);color:var(--pri)}.skin-ios header .act{background:var(--soft);color:var(--pri)}
.skin-ios .card{box-shadow:none;border-radius:14px}.skin-ios .btn{border-radius:12px}.skin-ios .btn.p{box-shadow:none}
.skin-ios nav.tabs{background:color-mix(in srgb,var(--nav) 80%,transparent);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border-top:.5px solid var(--line);box-shadow:none}
.skin-ios nav.tabs button{font-size:10.5px}.skin-ios nav.tabs .ic{height:26px}
.skin-ios .list .it{border-bottom:.5px solid var(--line)}
/* ---------- ANDROID · Material You ---------- */
body.skin-and{--font:Roboto,"Google Sans","Segoe UI",system-ui,sans-serif;--r:24px;--bg:color-mix(in srgb,var(--pri) 6%,#fcfdfc)}
body.skin-and.dark{--bg:color-mix(in srgb,var(--pri) 8%,#101413);--card:color-mix(in srgb,var(--pri) 6%,#191d1c);--nav:color-mix(in srgb,var(--pri) 10%,#151918)}
.skin-and header{background:color-mix(in srgb,var(--pri) 12%,var(--bg));color:var(--tx);box-shadow:none;min-height:64px}
.skin-and header .logo{border-radius:14px;background:var(--pri);color:#fff}.skin-and header .hbtn{background:transparent;color:var(--tx);border-radius:50%}.skin-and header .act{background:color-mix(in srgb,var(--pri) 18%,var(--card));color:var(--tx)}
.skin-and .card{box-shadow:none;background:color-mix(in srgb,var(--pri) 4%,var(--card))}
.skin-and .btn{border-radius:20px}.skin-and .btn.p{background:var(--pri);box-shadow:none}.skin-and .seg,.skin-and .seg button{border-radius:20px}
.skin-and nav.tabs{background:var(--nav);background:color-mix(in srgb,var(--pri) 9%,var(--card));border-top:0;box-shadow:none;padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.skin-and nav.tabs button{font-size:12px;color:var(--tx)}.skin-and nav.tabs button.on .ic{background:color-mix(in srgb,var(--pri) 24%,transparent);color:var(--pri)}.skin-and nav.tabs button.on{color:var(--tx)}
@media(max-width:899px){.skin-and .fab{display:flex;position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:31;height:56px;padding:0 20px;border-radius:16px;border:0;background:color-mix(in srgb,var(--pri) 25%,var(--card));color:var(--tx);font:inherit;font-weight:700;align-items:center;gap:8px;box-shadow:0 4px 14px #0003;cursor:pointer}}
/* ---------- TRANG CHỦ ---------- */
.hhero{position:relative;overflow:hidden;border-radius:calc(var(--r) + 6px);padding:20px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-bottom:14px}
.hhero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:#ffffff1f}.hhero::before{content:"";position:absolute;right:60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:#ffffff14}
.hhero .hi{font-size:14px;opacity:.9}.hhero h1{margin:2px 0 12px;font-size:26px;line-height:1.15}
.skin-ios .hhero h1{font-size:30px;letter-spacing:-.5px}.skin-and .hhero{border-radius:28px}.skin-win .hhero{border-radius:10px}
.hex{position:relative;z-index:1;display:flex;gap:14px;align-items:center;background:#ffffff1f;border-radius:16px;padding:12px;backdrop-filter:blur(6px)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff40 0);font-weight:800;font-size:14px}.ring span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 85%,#000)}
.hcta{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hcta button{border:0;border-radius:14px;padding:12px 6px;background:#fff;color:var(--pri);font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.hcta button i{font-style:normal;font-size:22px}
.skin-and .hcta button{border-radius:20px}.skin-win .hcta button{border-radius:6px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}@media(max-width:560px){.stat4{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--card);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}.st i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}.st b{display:block;font-size:20px;line-height:1.1}.st span{font-size:12px;color:var(--mut)}
.sech{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}.sech h2{font-size:17px;margin:0}.sech a{font-size:13px;color:var(--pri);cursor:pointer;font-weight:600}
.skin-ios .sech h2{font-size:20px;letter-spacing:-.3px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:var(--tx)}
.tool:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0000001a}.tool i{font-style:normal;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px}.tool b{font-size:14px}.tool span{font-size:12px;color:var(--mut)}
.skin-and .tool{border:0;background:color-mix(in srgb,var(--pri) 6%,var(--card))}.skin-and .tool i{border-radius:50%}.skin-ios .tool{border:0}
.h2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.h2col{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}.chk:last-child{border:0}.chk .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;border:2px solid var(--line)}.chk.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tips{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.tip{flex:0 0 260px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:13px}
.minibars{display:flex;align-items:flex-end;gap:4px;height:70px}.minibars span{flex:1;background:linear-gradient(var(--pri2),var(--pri));border-radius:4px 4px 0 0;min-height:3px}
/* chọn giao diện */
.skinpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.skinpick button{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;cursor:pointer;font:inherit;text-align:left}.skinpick button.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.mock{height:86px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden;background:#eef0f5}.mock i{position:absolute;display:block}
.sw{display:flex;flex-wrap:wrap;gap:10px}.sw button{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--tx)}

header img.logo{width:38px;height:38px;border-radius:10px;background:none!important;padding:0;object-fit:cover;box-shadow:0 2px 8px #0002}
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#1d3fa8,#4f46e5 60%,#7c3aed);color:#fff;transition:opacity .45s,visibility .45s}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 40px #0005;animation:spl 1.2s ease-in-out infinite alternate}
#splash b{font-size:22px;letter-spacing:.3px}#splash small{opacity:.85}
#splash i{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff55;border-top-color:#fff;animation:spin .8s linear infinite}
#splash.off{opacity:0;visibility:hidden}@keyframes spl{to{transform:translateY(-6px) scale(1.03)}}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

 if(c.length===1)return{key:ks[c[0]],warn:code?'Mã đề '+code+' chưa có đáp án – dùng đáp án mã '+c[0]:'Không đọc được mã đề – dùng đáp án mã '+c[0]};

 sc.p1=r2(sc.p1);sc.p2=r2(sc.p2);sc.p3=r2(sc.p3);sc.total=r2(sc.p1+sc.p2+sc.p3);return sc;}

function parseP1(s){s=s.toUpperCase();if(/\d/.test(s)){const o=[];for(const m of s.matchAll(/(\d+)\s*[\.\:\-\)]?\s*([ABCD])/g))o[+m[1]-1]=m[2];return [...o].map(x=>x||'');}return [...s.replace(/[^ABCD_\-]/g,'')].map(x=>/[ABCD]/.test(x)?x:'');}

/* ---- Bộ đọc đáp án đa định dạng ---- */
const NV=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();
const codeOf=s=>{const m=String(s??'').trim().match(/^(?:m[aã]\s*(?:đ|d)[eề](?:\s*thi)?|made|ma\s*de|(?:đ|d)[eề](?:\s*s[oố])?)?\s*[:\-#]?\s*(\d{1,6})$/i);return m?m[1]:null};
function parseLab(lab){let s=String(lab??'').trim();if(!s)return{};let part=0;let u=s.toUpperCase().replace(/PHẦN|PHAN/g,'').replace(/CÂU|CAU|SỐ/g,' ').trim();
 let m=u.match(/^(III|II|I)\s*[\.\-_:\s]+(.*)$/);if(m){part=m[1].length;u=m[2];}else if((m=u.match(/^P\s*([123])\s*[\.\-_:\s]+(.*)$/))){part=+m[1];u=m[2];}
 m=u.match(/(\d+)\s*[\.\-_\)]?\s*([A-D])?\s*[\)\.]?\s*$/i);if(!m)return{part};return{part,num:+m[1],sub:m[2]?m[2].toLowerCase():''};}
function assemble(list,cfg){const{n1,n2,n3}=cfg,k={p1:[],p2:[],p3:[]},p2s=[];let c1=0,c3=0,s2=0;
 const setP2=(q,j,v)=>{if(q<0||q>15||j<0||j>3)return;(p2s[q]=p2s[q]||['_','_','_','_'])[j]=v;s2=q*4+j+1;};
 for(const it of list){const raw=String(it.val??'').trim();if(!raw)continue;const V=raw.toUpperCase().replace(/\s+/g,'').replace(/Ð/g,'Đ');const L=parseLab(it.lab);
  const isNum=/^-?\d*[.,]?\d+$/.test(V)&&V.length<=6,isLet=/^[ABCD]$/.test(V),isDS1=/^(Đ|S|T|F|ĐÚNG|DUNG|SAI|TRUE|FALSE)$/.test(V),isDS4=/^[ĐDSTF]{4}$/.test(V)&&/[ĐSTF]/.test(V),isLS=/^[ABCD_\-\.\*]{2,}$/.test(V)&&/[ABC]/.test(V);
  const ds=x=>/^(Đ|D|T|ĐÚNG|DUNG|TRUE)$/.test(x)?'Đ':'S';
  if(L.part===3||(!L.part&&isNum&&!L.sub)){let i=L.num?(L.num>n3?L.num-n1-n2:L.num)-1:c3;if(i<0||i>11)i=c3;k.p3[i]=raw.replace(/\./g,',').replace(/\s/g,'');c3=i+1;continue;}
  if(L.part===2||L.sub||isDS4||isDS1||(V==='D'&&!L.part&&(c1>=n1||(L.num&&L.num>n1))&&n2)){let q=L.num?(L.num>n2?L.num-n1:L.num)-1:Math.floor(s2/4);
   if(isDS4){[...V].forEach((ch,j)=>setP2(q,j,ds(ch)));s2=(q+1)*4;}else if(isDS1||V==='D'){const j=L.sub?'abcd'.indexOf(L.sub):(L.num?(p2s[q]||[]).findIndex(x=>x==='_'):s2%4);setP2(q,j<0?0:j,ds(V));}continue;}
  if(isLS){[...V].forEach(ch=>{k.p1[c1++]=/[ABCD]/.test(ch)?ch:''});continue;}
  if(isLet){let i=L.num?L.num-1:c1;k.p1[i]=V;c1=i+1;}}
 k.p1=[...k.p1].map(x=>x||'');k.p2=[...p2s].map(a=>(a||['_','_','_','_']).join(''));k.p3=[...k.p3].map(x=>x||'');return k;}
const keyFilled=k=>k&&(k.p1.some(Boolean)||k.p2.some(x=>/[ĐS]/.test(x))||k.p3.some(Boolean));
function assembleAll(L,cfg){const out={};for(const c in L){const k=assemble(L[c],cfg);if(keyFilled(k))out[c||'']=k;}return out;}
function parseKeyTable(rows,cfg){rows=(rows||[]).map(r=>(r||[]).map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));if(!rows.length)return{};
 for(let h=0;h<Math.min(rows.length,12);h++){const H=rows[h].map(NV),ic=H.findIndex(x=>/^(ma ?de|made|de thi|ma de thi|de)$/.test(x)),iq=H.findIndex(x=>/^(cau|cau hoi|cau so|stt cau|so cau|stt)$/.test(x)),ia=H.findIndex(x=>/(dap an|^da$|dapan|answer|^key$)/.test(x));
  if(ic>=0&&iq>=0&&ia>=0){const L={};rows.slice(h+1).forEach(r=>{const c=codeOf(r[ic])||r[ic];if(c)(L[c]=L[c]||[]).push({lab:r[iq],val:r[ia]});});return assembleAll(L,cfg);}

function openTheme(){const p=uiPrefs(),sk=curSkin();
 const mock={win:'<i style="left:0;top:0;bottom:0;width:30%;background:#e5e7ef"></i><i style="left:34%;top:10px;right:8px;height:22px;border-radius:5px;background:VAR"></i><i style="left:34%;top:40px;width:28%;height:36px;border-radius:5px;background:#fff"></i><i style="left:66%;top:40px;right:8px;height:36px;border-radius:5px;background:#fff"></i>',
  ios:'<i style="left:8px;top:8px;width:60%;height:12px;border-radius:4px;background:#1c1c1e"></i><i style="left:8px;top:28px;right:8px;height:24px;border-radius:10px;background:VAR"></i><i style="left:0;right:0;bottom:0;height:16px;background:#ffffffcc;border-top:1px solid #ddd"></i><i style="left:8px;top:58px;right:8px;height:8px;border-radius:4px;background:#fff"></i>',
  and:'<i style="left:0;right:0;top:0;height:20px;background:VAR;opacity:.35"></i><i style="left:8px;top:28px;right:8px;height:30px;border-radius:16px;background:VAR"></i><i style="right:10px;bottom:22px;width:26px;height:20px;border-radius:8px;background:VAR;opacity:.6"></i><i style="left:0;right:0;bottom:0;height:16px;background:#e6efe9"></i>'};
 modal(`<div id="themeBox"><h2 style="margin:0 0 4px">🎨 Giao diện</h2><p class="muted" style="margin:0 0 12px">Chọn phong cách theo thiết bị, màu chủ đạo, chế độ sáng/tối và cỡ chữ. Áp dụng ngay.</p>
 <h3>Phong cách</h3><div class="skinpick"><button class="${p.skin==='auto'?'on':''}" onclick="setUI('skin','auto')"><div class="mock" style="display:grid;place-items:center;font-size:30px">✨</div><b>Tự động</b><div class="muted">Theo máy: hiện là ${SKINS[detectSkin()].l}</div></button>
 ${Object.entries(SKINS).map(([k,s])=>`<button class="${p.skin===k?'on':''}" onclick="setUI('skin','${k}')"><div class="mock">${mock[k].replace(/VAR/g,PALETTES[s.acc][1])}</div><b>${s.l}</b><div class="muted">${s.d}</div></button>`).join('')}</div>
 <h3>Màu chủ đạo</h3><div class="sw">${Object.entries(PALETTES).map(([k,[l,a,b]])=>`<button title="${l}" class="${p.accent===k?'on':''}" style="background:${a?`linear-gradient(135deg,${a},${b})`:'conic-gradient(#0a5fd6,#4f46e5,#0f766e,#0a5fd6)'}" onclick="setUI('accent','${k}')"></button>`).join('')}</div>
 <div class="muted" style="margin-top:4px">Đang dùng: ${PALETTES[p.accent==='auto'?SKINS[sk].acc:p.accent][0]}</div>
 <div class="grid2" style="margin-top:10px"><div><h3>Chế độ</h3><div class="seg">${[['auto','Theo hệ thống'],['off','☀️ Sáng'],['on','🌙 Tối']].map(([v,l])=>`<button class="${p.dark===v?'on':''}" onclick="setUI('dark','${v}')">${l}</button>`).join('')}</div></div>
 <div><h3>Cỡ chữ</h3><div class="seg">${[['s','Nhỏ'],['m','Vừa'],['l','Lớn'],['xl','Rất lớn']].map(([v,l])=>`<button class="${p.fs===v?'on':''}" onclick="setUI('fs','${v}')">${l}</button>`).join('')}</div></div></div></div>`);}
function openMenu(){const it=[['stu','👨‍🎓','Học sinh','Nhập Excel, lớp, SBD'],['more','⚙️','Cài đặt & phiếu','Thiết kế/in phiếu, sao lưu'],['theme','🎨','Giao diện','Phong cách, màu, sáng/tối'],['stat','📊','Thống kê','Phân tích câu hỏi'],['res','📋','Kết quả','Bảng điểm, xuất Excel']];
 modal(`<h2 style="margin:0 0 10px">☰ Menu</h2><div class="tools">${it.map(([k,ic,l,d])=>`<button class="tool" onclick="${k==='theme'?'openTheme()':`closeModal();go('${k}')`}"><i style="background:var(--soft)">${ic}</i><b>${l}</b><span>${d}</span></button>`).join('')}</div>`);}
const TOOLS=[['📸','Chấm bằng camera','Tự chụp khi thấy 4 góc','#e0f2fe','camGo()'],['🖼️','Chấm từ ảnh','Chọn nhiều ảnh cùng lúc','#ede9fe','needEx()&&scanFiles(\'#fImg\')'],['📝','Tạo bài thi','Cấu trúc, điểm, mẫu phiếu','#dcfce7','newExam()'],
 ['🔑','Nhập đáp án','Chạm chọn A B C D, Đ/S','#fef3c7','keyGo()'],['🔳','Quét QR đáp án','TN Maker, QM, app khác','#fce7f3','keyGo(1)'],['📂','Đáp án từ file','Excel, Word, TestPro…','#e0e7ff','keyGo(2)'],
 ['👨‍🎓','Nhập học sinh','Từ Excel theo lớp','#ccfbf1','go(\'stu\')'],['✏️','Thiết kế phiếu','Tuỳ số câu, giống mẫu Bộ','#ffedd5','designSheet(null)'],['🖨️','In phiếu theo lớp','In sẵn tên, tô sẵn SBD','#f3e8ff','designSheet((DB.sheets||[])[0]?.id||null)'],
 ['📋','Bảng điểm','Sửa bài, xuất Excel','#e0f2fe','go(\'res\')'],['🧪','Phân tích câu hỏi','Độ khó, phân biệt, α','#dcfce7','go(\'stat\')'],['📊','Excel tổng hợp','9 sheet đầy đủ','#fef9c3','needEx()&&exportFull()'],
 ['📄','Báo cáo Word','Báo cáo chất lượng đề','#fee2e2','needEx()&&exportReport(\'doc\')'],['💾','Sao lưu','Chuyển máy, phòng mất dữ liệu','#e2e8f0','backup()'],['🎨','Giao diện','3 phong cách · 10 màu','#fae8ff','openTheme()']];
const needEx=()=>{if(activeExam())return true;toast('Hãy tạo hoặc chọn bài thi trước');go('exam');return false;};
function camGo(){if(!needEx())return;go('scan');setTimeout(camOpen,50);}
function keyGo(m){const ex=activeExam();if(!ex){newExam();}else editExam(ex.id);setTimeout(()=>{const a=$('#keyArea');a&&a.scrollIntoView({behavior:'smooth'});if(m===1)qrCam();if(m===2)importKeys();},250);}
function vHome(){const ex=activeExam(),h=new Date().getHours(),hi=h<11?'Chào buổi sáng':h<14?'Chào buổi trưa':h<18?'Chào buổi chiều':'Chào buổi tối';
 const R=ex?(DB.results[ex.id]||[]):[],stu=ex?DB.students.filter(s=>!ex.cls||s.cls===ex.cls):[],pct=stu.length?Math.min(100,Math.round(R.length/stu.length*100)):(R.length?100:0);
 const allR=Object.values(DB.results).reduce((a,l)=>a+l.length,0),sc=R.filter(r=>r.score?.total!=null).map(r=>r.score.total),avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null;
 const keys=ex?Object.keys(ex.keys||{}):[],keyOk=ex&&keys.length&&keys.every(c=>{const s=kStat(ex.keys[c],ex);return s.a>=ex.n1&&s.b>=ex.n2&&s.d>=ex.n3;});
 const steps=[[DB.students.length>0,'Nhập danh sách học sinh',DB.students.length?DB.students.length+' học sinh':'Chưa có',"go('stu')"],[!!ex,'Tạo bài thi & chọn mẫu phiếu',ex?esc(tplOf(ex.sheet).name):'Chưa có',ex?`editExam('${ex.id}')`:'newExam()'],
  [!!keyOk,'Nhập đủ đáp án các mã đề',keys.length?'Mã '+keys.join(', '):'Chưa có','keyGo()'],[R.length>0,'Chấm bài',R.length+' bài','camGo()'],[R.length>=2,'Phân tích & xuất báo cáo',R.length>=2?'Sẵn sàng':'Cần ≥2 bài',"go('stat')"]];
 const MX=ex?maxScore(ex)||10:10,bins=[...Array(10)].map((_,i)=>sc.filter(v=>{const t=v/MX*10;return i<9?t>=i&&t<i+1:t>=9}).length),bm=Math.max(1,...bins);
 const tips=['Chụp phiếu trên nền tối, đủ sáng, thấy rõ 4 ô vuông đen ở góc – app tự nắn thẳng và tự xoay.','Phiếu tự thiết kế có dải mã ở mép dưới: chấm trên máy nào cũng tự nhận đúng mẫu.','Bấm vào từng bài trong Bảng điểm để xem ảnh và chạm sửa ô tô nhầm.','“Tạo QR chia sẻ” trong phần đáp án để chuyển đáp án sang điện thoại trong 2 giây.','Tab Thống kê → Phân tích câu hỏi: lọc “Cần xem lại” để sửa đề cho lần sau.','Sao lưu định kỳ (Khác → Sao lưu) để không mất dữ liệu khi đổi máy.'];
 $('#view').innerHTML=`<div class="hhero"><div class="hi">${hi}, thầy cô 👋 · ${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})}</div><h1>Chấm trắc nghiệm<br>nhanh – chính xác</h1>
 <div class="hex">${ex?`<div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div style="min-width:0"><div style="font-size:12px;opacity:.85">Bài thi đang chọn</div><b style="font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.name)}</b><div style="font-size:12.5px;opacity:.9">${R.length}${stu.length?'/'+stu.length:''} bài đã chấm · ${keys.length} mã đề${avg!=null?' · TB '+fmt(avg):''}</div></div>`:`<div style="font-size:30px">🚀</div><div><b>Bắt đầu bài thi đầu tiên</b><div style="font-size:12.5px;opacity:.9">Tạo bài thi → nhập đáp án → chấm bằng camera.</div></div>`}</div>
 <div class="hcta"><button onclick="camGo()"><i>📸</i>Camera chấm</button><button onclick="needEx()&&scanFiles('#fImg')"><i>🖼️</i>Chấm từ ảnh</button><button onclick="${ex?'keyGo(1)':'newExam()'}"><i>${ex?'🔳':'＋'}</i>${ex?'QR đáp án':'Tạo bài thi'}</button></div></div>
 <div class="stat4"><div class="st"><i style="background:#e0e7ff">📚</i><div><b>${DB.exams.length}</b><span>Bài thi</span></div></div><div class="st"><i style="background:#ccfbf1">👨‍🎓</i><div><b>${DB.students.length}</b><span>Học sinh</span></div></div>
 <div class="st"><i style="background:#fef3c7">✅</i><div><b>${allR}</b><span>Bài đã chấm</span></div></div><div class="st"><i style="background:#fce7f3">⭐</i><div><b>${avg!=null?fmt(avg):'–'}</b><span>Điểm TB bài hiện tại</span></div></div></div>
 <div class="sech"><h2>Công cụ</h2><a onclick="openTheme()">🎨 Đổi giao diện</a></div><div class="tools">${TOOLS.map(([ic,l,d,bg,fn])=>`<button class="tool" onclick="${fn}"><i style="background:${bg}">${ic}</i><b>${l}</b><span>${d}</span></button>`).join('')}</div>
 <div class="h2col" style="margin-top:14px"><div class="card"><h2>🧭 Tiến độ chuẩn bị</h2>${steps.map(([ok,l,d,fn],i)=>`<div class="chk ${ok?'done':''}" onclick="${fn}"><div class="dot">${ok?'✓':i+1}</div><div style="flex:1"><b style="font-size:14px">${l}</b><div class="muted">${d}</div></div><span class="muted">›</span></div>`).join('')}</div>
 <div class="card"><h2>🕘 Vừa chấm ${R.length?`<a class="muted" style="margin-left:auto;cursor:pointer" onclick="go('res')">Xem tất cả ›</a>`:''}</h2>${R.length?`<div class="minibars" title="Phổ điểm (quy về thang 10)">${bins.map(n=>`<span style="height:${n/bm*100}%"></span>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between;font-size:11px"><span>0</span><span>Phổ điểm</span><span>10</span></div><div class="list">${R.slice(0,4).map(itemHTML).join('')}</div>`:'<p class="muted">Chưa có bài chấm. Bấm <b>Camera chấm</b> để bắt đầu.</p>'}</div></div>
 <div class="sech"><h2>Mẹo hay</h2></div><div class="tips">${tips.map((t,i)=>`<div class="tip"><b>💡 Mẹo ${i+1}</b><div class="muted" style="margin-top:4px">${t}</div></div>`).join('')}</div>
 <footer>Chấm Trắc Nghiệm LKT · Lương Khánh Tường – THPT Bình Thạnh Đông · 0916780807</footer>`;}

try{applyUI()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await IDB.open();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}const d=await IDB.get('db');if(d)DB=Object.assign(DB,d);if(!DB.sheets)DB.sheets=[];registerSheets();applyUI();render();setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('off');setTimeout(()=>sp.remove(),600);}},450);})();
</script>
